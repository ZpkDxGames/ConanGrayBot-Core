name: Core quality
on:
  push:
    branches: [main, revamp/v2]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"
      - name: Scan all reachable history with confidential output redacted
        run: gitleaks detect --redact --no-banner --log-opts=--all
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts && ruff format --check backend tests scripts
      - run: mypy backend
      - run: python -m pytest --cov=backend --cov-report=json
      - run: python scripts/check_coverage.py
      - run: pip-audit -r requirements.lock
      - run: PYTHONPATH=. python scripts/export_contract.py && git diff --exit-code -- contracts
      - run: python scripts/build_artifact.py && python scripts/scan_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-source-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
